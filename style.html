<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Shape</title>
<style>
  body {
    background-color: #ff69b4; /* pink background like your image */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .star-svg {
    width: 150px;
    height: 150px;
  }

  /* Optional: Add a subtle glow */
  .star-svg polygon {
    filter: drop-shadow(0 0 6px white);
  }
</style>
</head>
<body>

<svg class="star-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <polygon 
    points="50,0 57,35 95,35 62,57 72,95 50,73 28,95 38,57 5,35 43,35"
    fill="white"/>
</svg>

</body>
</html>
